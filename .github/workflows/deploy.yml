name: Deploy NEXCALC to GitHub Pages

on:
  push:
    branches: [main]        # runs on every push to main
  workflow_dispatch:         # also lets you trigger it manually from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true  # if two deployments queue up, cancel the older one

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci              # ci is stricter than install — uses exact lockfile versions

      - name: Build
        run: npm run build       # outputs to dist/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist             # tell GitHub Pages where your built files are

  deploy:
    needs: build                 # only runs if build succeeds
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4